name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, claims, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Runs after the build so it can also scan the generated HTML for external
      # links that are not registered sources.
      - name: Verify claim ledger
        run: npm run verify:claims

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test (desktop, mobile, no-JS, axe)
        run: npm run test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7
